LegalCopyright = "Copyright © 2026 OrIsyVra Contributors"

[[bin]]
name = "orisyvra-analysis"
path = "src/main.rs"

[dependencies]
clap.workspace = true
orisyvra-core = { path = "../orisyvra-core", features = ["analysis"] }
rand.workspace = true

[build-dependencies]
winresource = "0.1.31"
