[package]
name = "orisyvra-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
orisyvra = { path = "../crates/orisyvra" }
tempfile = "3.12"

[[bin]]
name = "container"
path = "fuzz_targets/container.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keycard"
path = "fuzz_targets/keycard.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
