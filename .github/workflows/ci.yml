name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev
      - name: Select Rust stable
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base_sha"
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- '*.rs')
            if (( ${#files[@]} > 0 )); then
              rustfmt --edition 2021 --check "${files[@]}"
            fi
          else
            cargo fmt --all -- --check
          fi
      - name: Run Clippy
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base_sha"
            if git diff --name-only "$base_sha" HEAD | grep -Eq '^(Cargo\.toml|Cargo\.lock)$'; then
              cargo clippy --workspace --all-targets --all-features -- -D warnings
            else
              mapfile -t packages < <(git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- 'crates/*/*.rs' 'crates/*/src/**' | awk -F/ '$1 == "crates" && NF > 2 {print $2}' | sort -u)
              if (( ${#packages[@]} > 0 )); then
                args=()
                for package in "${packages[@]}"; do
                  args+=("-p" "$package")
                done
                cargo clippy "${args[@]}" --all-targets --all-features -- -D warnings
              else
                echo "No Rust crate source changes to lint."
              fi
            fi
          else
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          fi
      - run: cargo test --workspace --all-features

  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev
      - name: Select Rust stable
        run: |
          rustup update stable
          rustup default stable
      - run: cargo build --release --workspace
      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          New-Item -ItemType Directory -Force dist | Out-Null
          $icon = Get-ChildItem "target/release/build/orisyvra-gui-*/out/orisyvra.ico" | Select-Object -First 1
          if (-not $icon) { throw "Generated application icon was not found" }
          $env:ORISYVRA_SOURCE = $env:GITHUB_WORKSPACE
          $env:ORISYVRA_OUTPUT = Join-Path $env:GITHUB_WORKSPACE "dist"
          $env:ORISYVRA_ICON = $icon.FullName
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/OrIsyVra.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer validation failed" }
          if (-not (Test-Path "dist/OrIsyVra-Setup-x86_64.exe")) { throw "Installer output is missing" }
